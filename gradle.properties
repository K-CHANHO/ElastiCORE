org.gradle.caching=false

# Publishing to a Maven repository needs elasticorePublishUrl, -Username and
# -Password - set them in ~/.gradle/gradle.properties or pass them with -P.
# Never put credentials in this file: it is part of the repository.

# The version both builds publish. The plugin is a build of its own -
# a plugin cannot be applied by a sibling module of the build that
# produces it - so a version written in either script would be a
# second place to bump, and the one people forget.
elasticoreVersion=3.0.261015-alpha1
