plugins {
    id 'maven-publish'
}

allprojects {
    group = 'io.elasticore'
    version = elasticoreVersion

    repositories {
        mavenCentral()
    }

    // Every module reads its sources as UTF-8. This used to be set on the root
    // project only, which has no sources, so elasticore-base and the samples
    // compiled with the platform default - MS949 on a Korean Windows machine,
    // UTF-8 on Linux CI - and a Korean string in a test meant different text
    // on each.
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }

    // Hidden directories under a resources directory (editor or tool state) are
    // never packaged.
    tasks.withType(ProcessResources).configureEach {
        exclude '**/.*/**'
    }
    tasks.withType(Jar).configureEach {
        exclude '**/.*/**'
    }
}

// Root-level elcore task delegates to elasticore-template
tasks.register('elcore') {
    group = 'elasticore'
    description = 'Run ElastiCORE code generation on elasticore-template sample DSL'
    dependsOn ':elasticore-project:elasticore-template:elcore'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    println  project.name

    // Log published artifacts
    tasks.withType(PublishToMavenRepository).configureEach {
        doLast {
            println "[PUBLISH] ${publication.groupId}:${publication.artifactId}:${publication.version} -> ${repository.url}"
        }
    }
    
    // Test configuration for all subprojects
    tasks.withType(Test) {
        useJUnitPlatform()
        
        testLogging {
            events "passed", "skipped", "failed"
            showStandardStreams = false
            showExceptions = true
            showCauses = true
            showStackTraces = true
            
            afterSuite { desc, result ->
                if (!desc.parent) {
                    def output = "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)"
                    def startItem = '|  ', endItem = '  |'
                    def repeatLength = startItem.length() + output.length() + endItem.length()
                    println('\n' + ('-' * repeatLength) + '\n' + startItem + output + endItem + '\n' + ('-' * repeatLength))
                }
            }
        }
        
        reports {
            html.required = true
            junitXml.required = true
        }
    }
    
    // Only elasticore-base is published from here. The runtime libraries
    // configure their own publication; the samples (templates, pet store) and
    // the elasticore-project container used to be published too - an empty
    // io.elasticore:elasticore-project jar among them - though nothing should
    // depend on them.
    if (project.name == 'elasticore-base') {
        apply plugin: 'maven-publish'

        java {
            withSourcesJar()
            withJavadocJar()
        }

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java
                }
            }
            // Where to publish is the publisher's to say: -P flags or the
            // user's ~/.gradle/gradle.properties, never a file in this repository.
            // Without elasticorePublishUrl only publishToMavenLocal is available.
            def publishUrl = project.findProperty('elasticorePublishUrl')
            if (publishUrl) {
                repositories {
                    maven {
                        name = 'release'
                        url = publishUrl
                        credentials {
                            username = project.findProperty('elasticorePublishUsername')
                            password = project.findProperty('elasticorePublishPassword')
                        }
                    }
                }
            }
        }
        apply from: rootProject.file('gradle/publishing.gradle')
    }
}

// The plugin is an included build, and an included build contributes a jar to
// this one but never its verification or its publications. Without these two
// bridges its 249 lines of tests run on no CI path, and publishing this
// repository ships a framework whose recommended entry point stays behind.
project(':elasticore-project:elasticore-base').tasks.matching { it.name == 'check' }.configureEach {
    // Hung on base's check rather than a root task, because the root applies
    // no java plugin and so has no check of its own - while ./gradlew build
    // always passes through here.
    dependsOn gradle.includedBuild('elasticore-gradle-plugin').task(':check')
}
['publish', 'publishToMavenLocal'].each { name ->
    tasks.named(name) {
        dependsOn gradle.includedBuild('elasticore-gradle-plugin').task(':' + name)
    }
}

// A Maven Central release: the three libraries and the plugin with its marker,
// signed, staged by gradle/publishing.gradle and zipped the way the Central
// Portal takes it. The release workflow uploads build/central-bundle.zip;
// RELEASING.md has the steps.
def centralStaging = layout.buildDirectory.dir('central-bundle')
def releaseVersion = version.toString()

tasks.register('centralBundle', Zip) {
    group = 'publishing'
    description = 'Signs every published artifact and zips them for the Maven Central Portal'

    ['elasticore-base', 'elasticore-springboot3', 'elasticore-springboot4'].each {
        dependsOn ":elasticore-project:${it}:publishAllPublicationsToCentralBundleRepository"
    }
    dependsOn gradle.includedBuild('elasticore-gradle-plugin').task(':publishAllPublicationsToCentralBundleRepository')

    archiveFileName = 'central-bundle.zip'
    destinationDirectory = layout.buildDirectory
    from(centralStaging) {
        // This version only: the directory keeps what earlier runs staged, and
        // each artifact's maven-metadata.xml is Central's to write, not ours.
        include "**/${releaseVersion}/**"
    }

    // Central names a missing file only after validating the whole upload.
    doFirst {
        def problems = []
        int poms = 0
        centralStaging.get().asFile.eachFileRecurse(groovy.io.FileType.FILES) { file ->
            String name = file.name
            if (file.parentFile.name != releaseVersion || name ==~ /.*\.(asc|md5|sha1|sha256|sha512)/) {
                return
            }
            ['.asc', '.md5', '.sha1'].each { suffix ->
                if (!new File(file.parentFile, name + suffix).isFile()) {
                    problems << name + suffix
                }
            }
            if (name.endsWith('.pom')) {
                poms++
            }
            if (name.endsWith("-${releaseVersion}.jar")) {
                ['-sources.jar', '-javadoc.jar'].each { classifier ->
                    String companion = name - '.jar' + classifier
                    if (!new File(file.parentFile, companion).isFile()) {
                        problems << companion
                    }
                }
            }
        }
        // elasticore-base, -springboot3, -springboot4, the plugin, its marker
        if (poms != 5) {
            problems << "5 POMs (found ${poms})"
        }
        if (problems) {
            throw new GradleException('The Central bundle is missing ' + problems.join(', '))
        }
    }
}

// Refused before anything is built: Central takes neither a snapshot nor an
// unsigned file, and says so only after the upload.
gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(':centralBundle')) {
        if (releaseVersion.endsWith('-SNAPSHOT')) {
            throw new GradleException("Maven Central takes release versions only, and ${releaseVersion} is a snapshot. " +
                    'Set elasticoreVersion in gradle.properties - see RELEASING.md.')
        }
        if (!findProperty('signingKey')) {
            throw new GradleException('Maven Central refuses unsigned artifacts. Pass the signing key as ' +
                    'ORG_GRADLE_PROJECT_signingKey and its passphrase as ORG_GRADLE_PROJECT_signingPassword - see RELEASING.md.')
        }
    }
}
