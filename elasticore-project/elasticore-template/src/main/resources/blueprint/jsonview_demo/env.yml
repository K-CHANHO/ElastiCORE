elasticore:
  enable: true
  config:
    domainName: jsonview_demo
    framework: springboot
    mode: jpa
    j2ee: jakarta
    jsonview: auto
    apiPath: "/api/demo"
    jpa:
      useQueryMethod: true
  namespace:
    entity: io.elasticore.blueprint.domain.jsonview_demo.entity
    dto: io.elasticore.blueprint.domain.jsonview_demo.dto
    enumeration: io.elasticore.blueprint.domain.jsonview_demo.enums
    repository: io.elasticore.blueprint.domain.jsonview_demo.repository
    service: io.elasticore.blueprint.domain.jsonview_demo.service
    control: io.elasticore.blueprint.domain.jsonview_demo.controller
