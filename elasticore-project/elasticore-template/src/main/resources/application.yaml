
spring:
  application:
    name: elcore_blueprint

  sql:
    init:
      #data-locations: classpath:sql/initdata.sql
      mode: always

  jpa:
    show-sql: true
    generate-ddl: true
    hibernate:
      ddl-auto:
    properties:
      org.hibernate.envers.audit_table_suffix: _hist
      hibernate.default_batch_fetch_size: 100
      hibernate:
        format_sql: true
        show_sql: true
        hbm2ddl.auto: update
    defer-datasource-initialization: true



  datasource:
    # A local PostgreSQL unless DB_URL / DB_USERNAME / DB_PASSWORD say otherwise
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blueprint}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver



  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: false



logging:
  level:
    root: info
    io.elasticore.springboot3: debug
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

springdoc:
  swagger-ui:
    operationsSorter: method
