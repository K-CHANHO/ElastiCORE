elasticore:
  enable: true
  config:
    domainName: refdata
    framework: springboot
    mode: jpa
    j2ee: jakarta
    testCode: "true"
    apiPath: "/api/v1"
    table:
      prefix: ref_
    publisher:
      rules: [jpa-springboot-kt, ddd-aggregate, ddd-reference, ddd-value-object-kt]
  namespace:
    entity: io.elasticore.blueprint.domain.refdata.entity
    dto: io.elasticore.blueprint.domain.refdata.dto
    enumeration: io.elasticore.blueprint.domain.refdata.enums
    repository: io.elasticore.blueprint.domain.refdata.repository
    service: io.elasticore.blueprint.domain.refdata.service
    control: io.elasticore.blueprint.domain.refdata.controller
    port: io.elasticore.blueprint.domain.refdata.port
