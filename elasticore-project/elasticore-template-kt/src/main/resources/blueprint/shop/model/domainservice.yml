# The same domain service the Java sample declares, so the two can be compared
# language to language rather than described as comparable.
domainService:

  Pricing:
    desc: What an order costs once the products it names are priced
    uses: [Order, Product]

processManager:
  Loyalty:
    desc: Counts the orders a customer has placed
    on: [OrderPlaced]
    uses: [Customer]
