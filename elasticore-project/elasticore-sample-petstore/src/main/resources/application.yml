spring:
  application:
    name: petstore
  datasource:
    url: jdbc:h2:mem:petstore;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop          # a sample: the tables are made at start-up
    open-in-view: false
    defer-datasource-initialization: true   # data.sql runs after the tables exist
  sql:
    init:
      mode: always

petstore:
  vat-rate: 5.5        # percent, added to the lines
  discount-rate: 2.25  # percent, taken off the VAT-inclusive amount
  demo-accounts: true  # admin/admin and user/user at start-up

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
