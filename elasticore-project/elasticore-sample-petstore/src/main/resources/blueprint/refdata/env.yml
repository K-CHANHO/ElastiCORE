# Reference codes, apart from the pet store: an abstract entity (@abstract(entity)) whose
# subclasses each have a table, read together through one repository.
elasticore:
  enable: true
  config:
    domainName: refdata
    framework: springboot
    mode: jpa
    j2ee: jakarta
    apiPath: "/api"
    table:
      prefix: ref_
  namespace:
    base: io.elasticore.sample.petstore.refdata
