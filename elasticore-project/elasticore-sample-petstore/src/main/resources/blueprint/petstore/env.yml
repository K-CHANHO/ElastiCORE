elasticore:
  enable: true
  config:
    domainName: petstore
    framework: springboot
    mode: jpa
    j2ee: jakarta
    apiPath: "/api"             # REST 주소는 /api/petstore/...
    table:
      prefix: ps_
    referenceColumn: short      # 다른 애그리거트 참조 컬럼: category_id (기본은 2.x 식 category_category_id)
    annotations:
      genid: "genid(io.elasticore.springboot3.util.IdUtils.newId)"
  namespace:
    base: io.elasticore.sample.petstore
